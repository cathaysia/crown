name: check-unittest-cross

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-unitest-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - [i686-unknown-linux-gnu]
          - [x86_64-linux-android]

          - [arm-unknown-linux-gnueabihf]
          - [arm-unknown-linux-musleabi]

          - [armv7-unknown-linux-gnueabi]

          - [aarch64-unknown-linux-musl]
          - [aarch64-linux-android]
    env:
      CROSS_NO_WARNINGS: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: setup env
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install build-essential gcc cpp wireshark-dev libclang-dev -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Rust Nightly
        if: ${{ contains(matrix.target[0], 'mips') }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cross
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cross
          git: https://github.com/cross-rs/cross
          tag: v0.2.4

      - name: run unit tests for ${{ matrix.target[0] }}
        if: ${{ !contains(matrix.target[0], 'mips') }}
        run: |
          cross test --target=${{ matrix.target[0] }} -p crown

      - name: run unit tests for ${{ matrix.target[0] }}
        if: ${{ contains(matrix.target[0], 'mips') }}
        run: |
          RUSTFLAGS="-Zpanic_abort_tests" cross +nightly test --target=${{ matrix.target[0] }} -Z build-std=std,panic_abort

  # The aarch64 assembly modules (frozen OpenSSL perlasm output, see
  # docs/algorithms-status.md §1b) are exercised natively rather than through
  # `cross`, so the emulated CPU model can be picked: `max` exposes every
  # extension the modules dispatch on, `cortex-a72` turns SHA3/SM4/SVE off
  # and drives the in-module fallbacks.
  check-unitest-aarch64-asm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: setup env
        run: |
          sudo apt update -y
          sudo apt install gcc-aarch64-linux-gnu qemu-user-static -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-unknown-linux-gnu

      - name: run the aarch64 assembly tests under qemu
        run: |
          CPU=max scripts/check-aarch64.sh --lib
          CPU=cortex-a72 scripts/check-aarch64.sh --lib

  # The riscv64 assembly modules (frozen OpenSSL perlasm output, see
  # docs/algorithms-status.md §1c) are exercised natively for the same reason:
  # the `-cpu` model decides which extensions actually execute, while the
  # OPENSSL_riscvcap ISA string (CAPS) is what the dispatch reads, because
  # qemu-user's riscv_hwprobe only reports the baseline bits. The four runs
  # below walk the dispatch ladders, which are mutually exclusive per tier:
  # `max` with the full ISA string drives every vector tier, the scalar model
  # the Zknd/Zkne AES and Zbc GHASH ones, the Zvbc model the Zvkb+Zvbc GHASH
  # tier (and the base ChaCha20 body), and the baseline model the portable
  # paths with the T-table AES.
  check-unitest-riscv64-asm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: setup env
        run: |
          sudo apt update -y
          sudo apt install gcc-riscv64-linux-gnu qemu-user-static -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: riscv64gc-unknown-linux-gnu

      - name: run the riscv64 assembly tests under qemu (vector crypto)
        run: |
          scripts/check-riscv64.sh --lib

      - name: run the riscv64 assembly tests under qemu (scalar crypto)
        run: |
          CPU=rv64,zbb=true,zbc=true,zknd=true,zkne=true,zknh=true,zksed=true,zksh=true \
            CAPS=rv64gc_zbb_zbc_zknd_zkne_zknh_zksed_zksh \
            scripts/check-riscv64.sh --lib

      - name: run the riscv64 assembly tests under qemu (Zvbc GHASH tier)
        run: |
          CPU=rv64,v=true,zvbb=true,zvbc=true \
            CAPS=rv64gc_v_zvbb_zvbc \
            scripts/check-riscv64.sh --lib

      - name: run the riscv64 assembly tests under qemu (baseline)
        run: |
          CPU=rv64 CAPS= scripts/check-riscv64.sh --lib
